<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo | Comunidad</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-container">
  <header class="navbar">
    <div class="nav-brand"><a href="index.html" class="brand-logo"><div class="brand-icon">N</div><span>Nexo</span></a></div>
    <div class="search-container"><div class="search-input-wrapper"><svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><input type="search" id="globalSearchInput" class="search-input" placeholder="Buscar en la comunidad..."></div></div>
    <div class="nav-actions">
      <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
      <button id="openCreatePostBtn" class="btn btn-primary"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg><span>Crear Post</span></button>
      <a href="perfil.html" class="user-profile-btn"><div class="avatar">L</div><div class="user-info"><span class="user-name">lucas_isi</span></div></a>
    </div>
  </header>

  <div class="main-wrapper">
    <aside class="sidebar-left">
      <nav class="nav-menu">
        <span class="menu-label">Navegación</span>
        <a href="index.html" class="nav-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Feed Principal</span></a>
        <a href="apuntes.html" class="nav-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span>Banco de Apuntes</span></a>
        <a href="grupos.html" class="nav-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>Grupos</span></a>
      </nav>
      <div class="nav-menu" style="margin-top:8px;">
        <span class="menu-label">Comunidades</span>
        <div id="comunidadNavList"></div>
      </div>
    </aside>

    <main class="content-feed">
      <div class="community-header" id="communityHeader"></div>

      <div class="feed-tabs">
        <button class="tab-btn active"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span>Popular</span></button>
        <button class="tab-btn"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>Recientes</span></button>
        <button class="tab-btn"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>Apuntes</span></button>
      </div>

      <div id="communityFeed" style="display:flex;flex-direction:column;gap:14px;"></div>
    </main>

    <aside class="sidebar-right">
      <div class="widget-card" id="communityInfo"></div>
      <div class="widget-card" id="communityRules"></div>
      <div class="widget-card" id="communityMods"></div>
    </aside>
  </div>
</div>

<!-- Create post modal (reutilizado) -->
<div id="createPostModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-header"><h2 class="modal-title">Crear publicación</h2><button class="btn-icon close-modal-btn">&times;</button></div>
    <form id="createPostForm">
      <div class="modal-body">
        <div class="form-group"><label class="form-label" for="postTagSelect">Tipo</label><select id="postTagSelect" class="form-select"><option value="apunte">📄 Apunte</option><option value="duda">❓ Duda</option><option value="informacion">ℹ️ Info</option><option value="grupo_estudio">👥 Grupo</option></select></div>
        <div class="form-group"><label class="form-label" for="postTitleInput">Título *</label><input type="text" id="postTitleInput" class="form-input" required></div>
        <div class="form-group"><label class="form-label" for="postContentInput">Descripción *</label><textarea id="postContentInput" class="form-textarea" rows="4" required></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary close-modal-btn">Cancelar</button><button type="submit" class="btn btn-primary">Publicar</button></div>
    </form>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script>
  (function(){ const t=localStorage.getItem('nexo-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); document.getElementById('themeToggleBtn').innerHTML=t==='dark'?'☀️':'🌙'; })();
  document.getElementById('themeToggleBtn').addEventListener('click',()=>{ const c=document.documentElement.getAttribute('data-theme'); const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('nexo-theme',n); document.getElementById('themeToggleBtn').innerHTML=n==='dark'?'☀️':'🌙'; });

  const params = new URLSearchParams(location.search);
  const slug = params.get('slug') || 'sistemas-utn-ba';
  const com = NEXO.comunidades.find(c=>c.slug===slug) || NEXO.comunidades[0];

  // Nav list
  document.getElementById('comunidadNavList').innerHTML = NEXO.comunidades.map(c=>`
    <a href="comunidad.html?slug=${c.slug}" class="nav-item ${c.slug===slug?'active':''}">
      <div class="avatar" style="width:20px;height:20px;font-size:9px;border-radius:4px;">${c.nombre[0]}</div>
      <span>${c.nombre}</span>
    </a>`).join('');

  // Header
  document.getElementById('communityHeader').innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <div class="avatar lg" style="border-radius:var(--radius-md);">${com.nombre[0]}</div>
      <div style="flex:1;min-width:0;">
        <div class="community-title">r/${com.nombre}</div>
        <div class="community-slug">r/${com.slug}</div>
        <p style="font-size:var(--text-sm);color:var(--text-secondary);line-height:1.5;">${com.descripcion}</p>
        <div class="community-stats">
          <div><strong>${com.miembros.toLocaleString()}</strong><span>Miembros</span></div>
          <div><strong style="color:var(--accent-emerald);">${NEXO.posts.filter(p=>p.comunidad_slug===slug).length}</strong><span>Publicaciones</span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
        <button class="btn btn-primary" id="joinBtn">${com.miembros>0?'✓ Miembro':'Unirse'}</button>
        <button class="btn btn-secondary" onclick="document.getElementById('openCreatePostBtn').click()">Publicar</button>
      </div>
    </div>`;

  // Widgets
  document.getElementById('communityInfo').innerHTML = `<div class="widget-title"><span>ℹ️ Sobre la comunidad</span></div><p style="font-size:var(--text-xs);color:var(--text-muted);line-height:1.5;">${com.descripcion}</p><div style="margin-top:10px;font-size:var(--text-xs);color:var(--text-muted);">👥 ${com.miembros.toLocaleString()} miembros</div>`;
  document.getElementById('communityRules').innerHTML = `<div class="widget-title"><span>📋 Reglas</span></div><div style="font-size:var(--text-xs);color:var(--text-muted);line-height:1.7;white-space:pre-line;">${com.reglas||'1. Respeto mutuo.\n2. Contenido académico relevante.\n3. No spam.'}</div>`;
  document.getElementById('communityMods').innerHTML = `<div class="widget-title"><span>🛡️ Moderadores</span></div><a href="perfil.html?alias=mod_sistemas" style="display:flex;align-items:center;gap:8px;margin-top:4px;"><div class="avatar sm">M</div><span style="font-size:var(--text-sm);color:var(--accent-violet);">u/mod_sistemas</span></a>`;

  // Feed
  const TIPO_CLASS = { apunte:'badge-apunte', duda:'badge-duda', informacion:'badge-info', grupo_estudio:'badge-grupo' };
  const TIPO_LABEL = { apunte:'Apunte', duda:'Duda', informacion:'Info', grupo_estudio:'Grupo' };
  const posts = NEXO.posts.filter(p=>p.comunidad_slug===slug);

  function renderFeed(list) {
    document.getElementById('communityFeed').innerHTML = list.map(p=>`
      <div class="post-card">
        <div class="vote-col">
          <span class="vote-count positive">${p.votos}</span>
        </div>
        <div class="post-content">
          <div class="post-meta"><span class="post-badge ${TIPO_CLASS[p.tipo]}">${TIPO_LABEL[p.tipo]}</span><span style="color:var(--text-muted)">u/${p.autor} · ${p.hace}</span>${p.materia?`<span class="tag">${p.materia}</span>`:''}</div>
          <div class="post-title"><a href="post.html?id=${p.id}">${p.titulo}</a></div>
          <div class="post-excerpt">${p.descripcion}</div>
          <div class="post-actions"><a href="post.html?id=${p.id}" class="post-action-btn">💬 ${p.comentarios} comentarios</a></div>
        </div>
      </div>`).join('') || '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Sin publicaciones</div></div>';
  }

  // Tabs
  const tabLists = [posts.sort((a,b)=>b.votos-a.votos), [...posts].sort((a,b)=>b.id-a.id), posts.filter(p=>p.tipo==='apunte')];
  document.querySelectorAll('.tab-btn').forEach((btn,i)=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderFeed(tabLists[i]);
  }));

  // Modal
  const modal=document.getElementById('createPostModal');
  document.getElementById('openCreatePostBtn').addEventListener('click',()=>modal.classList.add('open'));
  document.querySelectorAll('.close-modal-btn').forEach(b=>b.addEventListener('click',()=>modal.classList.remove('open')));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});
  document.getElementById('createPostForm').addEventListener('submit',e=>{
    e.preventDefault();
    modal.classList.remove('open'); e.target.reset();
  });

  renderFeed(tabLists[0]);
</script>
</body>
</html>
