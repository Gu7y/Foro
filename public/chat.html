<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo | Chat del Grupo</title>
  <meta name="description" content="Chat interno del grupo de estudio en Nexo.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .chat-layout { display:flex; height:calc(100vh - var(--navbar-height)); overflow:hidden; }
    .chat-sidebar { width:280px; border-right:1px solid var(--border-color); display:flex; flex-direction:column; flex-shrink:0; }
    .chat-sidebar-header { padding:16px; border-bottom:1px solid var(--border-color); }
    .chat-group-list { flex:1; overflow-y:auto; }
    .chat-group-item { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; transition:background var(--transition-fast); border-bottom:1px solid var(--border-subtle); }
    .chat-group-item:hover { background:var(--bg-hover); }
    .chat-group-item.active { background:var(--accent-violet-glow); border-left:3px solid var(--accent-violet); }
    .chat-group-info { flex:1; min-width:0; }
    .chat-group-name { font-size:var(--text-sm); font-weight:600; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-group-preview { font-size:var(--text-xs); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-main { flex:1; display:flex; flex-direction:column; min-width:0; }
    .chat-header { padding:14px 20px; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .chat-header-info { flex:1; min-width:0; }
    .chat-title { font-size:var(--text-md); font-weight:700; color:var(--text-main); }
    .chat-subtitle { font-size:var(--text-xs); color:var(--text-muted); }
    .online-dot { width:8px; height:8px; border-radius:50%; background:var(--accent-emerald); display:inline-block; margin-right:4px; }
    .send-btn { width:40px; height:40px; border-radius:var(--radius-full); background:var(--accent-violet); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background var(--transition-fast); }
    .send-btn:hover { background:var(--accent-violet-hover); }
    @media(max-width:640px){ .chat-sidebar{display:none;} }
  </style>
</head>
<body>
<div class="app-container">
  <header class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">N</div>
        <span>Nexo</span>
      </a>
    </div>
    <div class="nav-actions" style="margin-left:auto;">
      <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
      <a href="grupos.html" class="btn btn-secondary btn-sm">← Grupos</a>
      <a href="perfil.html" class="user-profile-btn">
        <div class="avatar">L</div>
        <div class="user-info"><span class="user-name">lucas_isi</span></div>
      </a>
    </div>
  </header>

  <div class="chat-layout">
    <!-- Grupos sidebar -->
    <div class="chat-sidebar">
      <div class="chat-sidebar-header">
        <div style="font-size:var(--text-xs);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);">Mis Grupos</div>
      </div>
      <div class="chat-group-list" id="chatGroupList"></div>
    </div>

    <!-- Chat principal -->
    <div class="chat-main">
      <div class="chat-header">
        <div class="avatar" style="background:linear-gradient(135deg,#7c5af0,#10d48e);">A</div>
        <div class="chat-header-info">
          <div class="chat-title" id="chatTitle">AED — Parcial Octubre</div>
          <div class="chat-subtitle"><span class="online-dot"></span> <span id="chatMembers">3 integrantes</span> · <span id="chatMateria">Algoritmos y Estructuras de Datos</span></div>
        </div>
        <a href="grupos.html" class="btn btn-ghost btn-sm">Ver grupo</a>
      </div>

      <div class="chat-messages" id="chatMessages" aria-live="polite" aria-label="Mensajes del grupo"></div>

      <form class="chat-input-bar" id="chatForm">
        <input type="text" id="chatInput" class="form-input" placeholder="Escribí un mensaje..." autocomplete="off" maxlength="1000" aria-label="Mensaje">
        <button type="submit" class="send-btn" aria-label="Enviar">
          <svg width="18" height="18" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script>
  (function(){ const t=localStorage.getItem('nexo-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); document.getElementById('themeToggleBtn').innerHTML=t==='dark'?'☀️':'🌙'; })();
  document.getElementById('themeToggleBtn').addEventListener('click',()=>{ const c=document.documentElement.getAttribute('data-theme'); const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('nexo-theme',n); document.getElementById('themeToggleBtn').innerHTML=n==='dark'?'☀️':'🌙'; });

  const myGrupos = NEXO.grupos.filter(g=>g.miembro);
  let activeGrupoId = 1;

  function renderGroupList() {
    const c = document.getElementById('chatGroupList');
    c.innerHTML = myGrupos.map(g => `
      <div class="chat-group-item ${g.id===activeGrupoId?'active':''}" data-id="${g.id}">
        <div class="avatar" style="width:36px;height:36px;font-size:13px;">${g.nombre[0]}</div>
        <div class="chat-group-info">
          <div class="chat-group-name">${g.nombre}</div>
          <div class="chat-group-preview">${g.materia}</div>
        </div>
      </div>`).join('');
    document.querySelectorAll('.chat-group-item').forEach(el => el.addEventListener('click', () => {
      activeGrupoId = Number(el.dataset.id);
      loadChat();
    }));
  }

  function formatTime(t) {
    const now = new Date();
    return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  }

  function renderMsg(m) {
    const own = m.propio;
    return `
    <div class="chat-msg ${own?'own':''}">
      ${!own ? `<div class="avatar sm">${m.inicial}</div>` : ''}
      <div>
        ${!own ? `<div style="font-size:10px;color:var(--text-muted);margin-bottom:3px;${own?'text-align:right':''}">u/${m.autor}</div>` : ''}
        <div class="chat-bubble">${escHtml(m.texto)}</div>
        <div class="chat-time">${m.hora}</div>
      </div>
      ${own ? `<div class="avatar sm">${m.inicial}</div>` : ''}
    </div>`;
  }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function scrollBottom() {
    const c = document.getElementById('chatMessages');
    c.scrollTop = c.scrollHeight;
  }

  function loadChat() {
    const g = NEXO.grupos.find(x=>x.id===activeGrupoId);
    if (!g) return;
    document.getElementById('chatTitle').textContent = g.nombre;
    document.getElementById('chatMateria').textContent = g.materia;
    document.getElementById('chatMembers').textContent = `${g.cupo_actual} integrantes`;
    renderGroupList();
    const msgs = (NEXO.mensajes||[]).filter(m=>m.grupo_id===activeGrupoId);
    document.getElementById('chatMessages').innerHTML = msgs.length
      ? msgs.map(renderMsg).join('')
      : `<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">Sin mensajes</div><div class="empty-desc">¡Sé el primero en escribir!</div></div>`;
    scrollBottom();
  }

  document.getElementById('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = document.getElementById('chatInput');
    const txt = inp.value.trim();
    if (!txt) return;
    const newMsg = { id:Date.now(), grupo_id:activeGrupoId, autor:NEXO.currentUser.alias, inicial:NEXO.currentUser.inicial, texto:txt, hora:formatTime(), propio:true };
    if (!NEXO.mensajes) NEXO.mensajes = [];
    NEXO.mensajes.push(newMsg);
    const c = document.getElementById('chatMessages');
    const empty = c.querySelector('.empty-state');
    if (empty) c.innerHTML = '';
    c.insertAdjacentHTML('beforeend', renderMsg(newMsg));
    inp.value = '';
    scrollBottom();
  });

  renderGroupList();
  loadChat();
</script>
</body>
</html>
