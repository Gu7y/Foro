<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo | Banco de Apuntes</title>
  <meta name="description" content="Encontrá apuntes, resúmenes y guías de estudio compartidos por la comunidad universitaria de Nexo.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .apunte-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
    .apunte-card {
      background:var(--bg-surface); border:1px solid var(--border-color);
      border-radius:var(--radius-lg); padding:16px;
      transition:border-color var(--transition-normal), box-shadow var(--transition-normal);
      display:flex; flex-direction:column; gap:10px;
    }
    .apunte-card:hover { border-color:var(--accent-violet); box-shadow:var(--shadow-md); }
    .apunte-thumb {
      height:80px; border-radius:var(--radius-md);
      background:linear-gradient(135deg, rgba(124,90,240,0.15), rgba(168,85,247,0.08));
      display:flex; align-items:center; justify-content:center; font-size:36px;
    }
  </style>
</head>
<body>
<div class="app-container">
  <header class="navbar">
    <div class="nav-brand"><a href="index.html" class="brand-logo"><div class="brand-icon">N</div><span>Nexo</span><span class="brand-tag">Universitario</span></a></div>
    <div class="search-container">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="search" id="globalSearchInput" class="search-input" placeholder="Buscar apuntes por materia, título...">
      </div>
    </div>
    <div class="nav-actions">
      <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
      <a href="perfil.html" class="user-profile-btn"><div class="avatar">L</div><div class="user-info"><span class="user-name">lucas_isi</span></div></a>
    </div>
  </header>

  <div class="main-wrapper">
    <aside class="sidebar-left">
      <nav class="nav-menu">
        <span class="menu-label">Navegación</span>
        <a href="index.html" class="nav-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Feed Principal</span></a>
        <a href="apuntes.html" class="nav-item active"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span>Banco de Apuntes</span></a>
        <a href="grupos.html" class="nav-item"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>Grupos</span></a>
      </nav>
      <div class="sidebar-filter-box">
        <label class="menu-label" for="filterAMat" style="padding:0">Materia</label>
        <select id="filterAMat" class="filter-select"></select>
      </div>
      <div class="sidebar-filter-box">
        <label class="menu-label" for="filterASede" style="padding:0">Sede</label>
        <select id="filterASede" class="filter-select"></select>
      </div>
      <div class="sidebar-filter-box">
        <label class="menu-label" for="filterATipo" style="padding:0">Tipo de archivo</label>
        <select id="filterATipo" class="filter-select">
          <option value="">Todos</option>
          <option value="pdf">PDF</option>
          <option value="imagen">Imagen</option>
          <option value="ninguno">Sin archivo</option>
        </select>
      </div>
    </aside>

    <main class="content-feed">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <div>
          <h1 style="font-size:var(--text-xl);font-weight:800;">Banco de Apuntes</h1>
          <p style="font-size:var(--text-sm);color:var(--text-muted);margin-top:2px;" id="resultCount">Cargando...</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="sortApuntes" class="filter-select" style="width:auto;">
            <option value="votos">Más votados</option>
            <option value="reciente">Más recientes</option>
            <option value="comentarios">Más comentados</option>
          </select>
          <button id="viewGrid" class="btn-icon" title="Vista cuadrícula" aria-label="Vista cuadrícula">⊞</button>
          <button id="viewList" class="btn-icon" title="Vista lista" aria-label="Vista lista">☰</button>
        </div>
      </div>

      <div id="apuntesContainer" class="apunte-grid"></div>

      <div class="pagination" id="pagination"></div>
    </main>

    <aside class="sidebar-right">
      <div class="widget-card">
        <div class="widget-title"><span>📊 Stats del banco</span></div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:var(--text-sm);">
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted)">Total apuntes</span><strong>348</strong></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted)">PDFs</span><strong style="color:var(--accent-rose)">📄 212</strong></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted)">Imágenes</span><strong style="color:var(--accent-blue)">🖼 136</strong></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted)">Materias cubiertas</span><strong>11</strong></div>
        </div>
      </div>
      <div class="widget-card">
        <div class="widget-title"><span>🔥 Materias populares</span></div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:var(--text-sm);">
            <span>Algoritmos (AED)</span>
            <div style="width:60px;height:4px;background:var(--bg-elevated);border-radius:2px;overflow:hidden;"><div style="width:90%;height:100%;background:var(--accent-violet);border-radius:2px;"></div></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:var(--text-sm);">
            <span>Bases de Datos</span>
            <div style="width:60px;height:4px;background:var(--bg-elevated);border-radius:2px;overflow:hidden;"><div style="width:75%;height:100%;background:var(--accent-emerald);border-radius:2px;"></div></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:var(--text-sm);">
            <span>Análisis Mat. I</span>
            <div style="width:60px;height:4px;background:var(--bg-elevated);border-radius:2px;overflow:hidden;"><div style="width:60%;height:100%;background:var(--accent-amber);border-radius:2px;"></div></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:var(--text-sm);">
            <span>Redes</span>
            <div style="width:60px;height:4px;background:var(--bg-elevated);border-radius:2px;overflow:hidden;"><div style="width:45%;height:100%;background:var(--accent-blue);border-radius:2px;"></div></div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Inicio</span></a>
    <a href="apuntes.html" class="mobile-nav-item active"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span>Apuntes</span></a>
    <a href="grupos.html" class="mobile-nav-item"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span>Grupos</span></a>
    <a href="perfil.html" class="mobile-nav-item"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>Perfil</span></a>
  </nav>
</div>

<script src="js/mock-data.js"></script>
<script>
  (function(){ const t=localStorage.getItem('nexo-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); document.getElementById('themeToggleBtn').innerHTML=t==='dark'?'☀️':'🌙'; })();
  document.getElementById('themeToggleBtn').addEventListener('click',()=>{ const c=document.documentElement.getAttribute('data-theme'); const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('nexo-theme',n); document.getElementById('themeToggleBtn').innerHTML=n==='dark'?'☀️':'🌙'; });

  const FILE_EMOJI = { pdf:'📄', imagen:'🖼️', ninguno:'📝' };
  const apuntes = NEXO.posts.filter(p=>p.tipo==='apunte');
  let viewMode = 'grid';
  let currentPage = 1;
  const PER_PAGE = 6;

  function fileType(p) {
    if (!p.archivos.length) return 'ninguno';
    const m = p.archivos[0].tipo;
    return m === 'pdf' ? 'pdf' : 'imagen';
  }

  function renderCard(p) {
    const ft = fileType(p);
    if (viewMode === 'grid') {
      return `
      <div class="apunte-card">
        <div class="apunte-thumb">${FILE_EMOJI[ft]}</div>
        <div>
          <div class="post-tags"><span class="tag">${p.materia||'General'}</span>${p.tags.slice(0,2).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
          <a href="post.html?id=${p.id}" style="font-size:var(--text-sm);font-weight:700;color:var(--text-main);display:block;margin:6px 0;line-height:1.35;">${p.titulo}</a>
          <div style="font-size:var(--text-xs);color:var(--text-muted);">u/${p.autor} · ${p.hace}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:auto;">
          <span style="font-size:var(--text-xs);color:var(--text-muted);">⬆️ ${p.votos} · 💬 ${p.comentarios}</span>
          <span style="flex:1"></span>
          ${p.archivos.length ? `<a class="file-pill" href="#"><svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Descargar</a>` : ''}
        </div>
      </div>`;
    } else {
      return `
      <div class="post-card">
        <div class="vote-col"><span class="vote-count positive">${p.votos}</span></div>
        <div class="post-content">
          <div class="post-tags"><span class="tag">${p.materia||'General'}</span>${p.tags.slice(0,2).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
          <div class="post-title"><a href="post.html?id=${p.id}">${p.titulo}</a></div>
          <div class="post-excerpt">${p.descripcion}</div>
          <div class="post-actions">
            <span style="font-size:var(--text-xs);color:var(--text-muted);">u/${p.autor} · ${p.hace}</span>
            ${p.archivos.length ? `<a class="file-pill" href="#" style="margin-left:auto;"><svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>${p.archivos[0].nombre}</a>` : ''}
          </div>
        </div>
      </div>`;
    }
  }

  function applyFilters() {
    const mat  = document.getElementById('filterAMat').value;
    const sede = document.getElementById('filterASede').value;
    const tipo = document.getElementById('filterATipo').value;
    const sort = document.getElementById('sortApuntes').value;
    const q    = document.getElementById('globalSearchInput').value.toLowerCase();

    let list = apuntes.filter(p => {
      if (mat  && p.materia !== NEXO.materias.find(m=>m.id==mat)?.nombre) return false;
      if (sede && p.sede !== NEXO.sedes.find(s=>s.id==sede)?.nombre) return false;
      if (tipo && fileType(p) !== tipo) return false;
      if (q && !p.titulo.toLowerCase().includes(q) && !p.descripcion.toLowerCase().includes(q)) return false;
      return true;
    });

    if (sort==='votos') list.sort((a,b)=>b.votos-a.votos);
    else if (sort==='reciente') list.sort((a,b)=>b.id-a.id);
    else if (sort==='comentarios') list.sort((a,b)=>b.comentarios-a.comentarios);

    document.getElementById('resultCount').textContent = `${list.length} apunte${list.length!==1?'s':''} encontrado${list.length!==1?'s':''}`;

    // Pagination
    const total = list.length;
    const pages = Math.ceil(total/PER_PAGE);
    if (currentPage > pages) currentPage = 1;
    const slice = list.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);

    const c = document.getElementById('apuntesContainer');
    c.className = viewMode==='grid' ? 'apunte-grid' : '';
    c.style.display = viewMode==='list'?'flex':'';
    c.style.flexDirection = viewMode==='list'?'column':'';
    c.style.gap = '14px';
    c.innerHTML = slice.length ? slice.map(renderCard).join('') : '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📭</div><div class="empty-title">Sin apuntes</div><div class="empty-desc">Sé el primero en compartir un apunte para esta materia.</div></div>';

    // Pagination controls
    const pag = document.getElementById('pagination');
    if (pages <= 1) { pag.innerHTML=''; return; }
    pag.innerHTML = `
      <button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>
      ${Array.from({length:pages},(_,i)=>`<button class="page-btn ${i+1===currentPage?'active':''}" onclick="changePage(${i+1})">${i+1}</button>`).join('')}
      <button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
  }

  function changePage(p) { currentPage=p; applyFilters(); window.scrollTo({top:0,behavior:'smooth'}); }

  // Populate filter selects
  const mSel=document.getElementById('filterAMat'); mSel.innerHTML='<option value="">Todas las materias</option>'; NEXO.materias.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.nombre;mSel.appendChild(o);});
  const sSel=document.getElementById('filterASede'); sSel.innerHTML='<option value="">Todas las sedes</option>'; NEXO.sedes.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.nombre;sSel.appendChild(o);});

  ['filterAMat','filterASede','filterATipo','sortApuntes'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{currentPage=1;applyFilters();}));
  document.getElementById('globalSearchInput').addEventListener('input',()=>{currentPage=1;applyFilters();});

  document.getElementById('viewGrid').addEventListener('click',()=>{ viewMode='grid'; applyFilters(); });
  document.getElementById('viewList').addEventListener('click',()=>{ viewMode='list'; applyFilters(); });

  applyFilters();
</script>
</body>
</html>
