    <main class="content-feed">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <div>
          <h1 style="font-size:var(--text-xl);font-weight:800;">Notificaciones</h1>
          <p style="font-size:var(--text-sm);color:var(--text-muted);margin-top:2px;" id="unreadCount"></p>
        </div>
        <button class="btn btn-secondary btn-sm" id="markAllRead">Marcar todas como leídas</button>
      </div>
      <div class="page-tabs" style="margin-bottom:16px;">
        <button class="page-tab active" data-filter="todas">Todas</button>
        <button class="page-tab" data-filter="no-leidas">No leídas</button>
      </div>
      <div style="background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;">
        <div id="notifList"></div>
      </div>
    </main>
    <aside class="sidebar-right">
      <div class="widget-card">
        <div class="widget-title"><span>⚙️ Preferencias</span></div>
        <div style="display:flex;flex-direction:column;gap:12px;font-size:var(--text-sm);">
          <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;">

          <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;">

<script src="js/mock-data.js"></script>
<script>
  (function(){ const t=localStorage.getItem('nexo-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); document.getElementById('themeToggleBtn').innerHTML=t==='dark'?'☀️':'🌙'; })();
  document.getElementById('themeToggleBtn').addEventListener('click',()=>{ const c=document.documentElement.getAttribute('data-theme'); const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('nexo-theme',n); document.getElementById('themeToggleBtn').innerHTML=n==='dark'?'☀️':'🌙'; });

  let showFilter = 'todas';

  function updateCount() {
    const u = NEXO.notificaciones.filter(n=>!n.leida).length;
    document.getElementById('unreadCount').textContent = u > 0 ? `${u} notificaciones sin leer` : 'Todo al día ✓';
  }

  function renderNotifs() {
    const list = showFilter==='no-leidas' ? NEXO.notificaciones.filter(n=>!n.leida) : NEXO.notificaciones;
    const c = document.getElementById('notifList');
    if (!list.length) {
      c.innerHTML = '<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">Sin notificaciones</div></div>';
      return;
    }
    c.innerHTML = list.map(n => `
      <div class="notif-item ${n.leida?'':'unread'}" data-id="${n.id}" ${n.url?`onclick="markRead(${n.id});window.location='${n.url}'"`:''}>
        <div class="notif-icon" style="background:var(--bg-elevated);font-size:18px;">${n.icono}</div>
        <div class="notif-body">
          <div class="notif-text">${n.mensaje}</div>
          <div class="notif-time">${n.hace}</div>
        </div>
        ${!n.leida ? `<div class="notif-dot" title="Sin leer"></div>` : ''}
      </div>`).join('');
    updateCount();
  }

  function markRead(id) {
    const n = NEXO.notificaciones.find(x=>x.id===id);
    if (n) { n.leida = true; renderNotifs(); }
  }

  document.getElementById('markAllRead').addEventListener('click', () => {
    NEXO.notificaciones.forEach(n=>n.leida=true);
    renderNotifs();
  });

  document.querySelectorAll('.page-tab[data-filter]').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.page-tab[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    showFilter = btn.dataset.filter;
    renderNotifs();
  }));

  renderNotifs();
</script>
</body>
</html>
